<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Team MQTT Tester — IoT Simulator</title>
  <script src="https://unpkg.com/mqtt@5/dist/mqtt.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
           background: #0f172a; color: #e2e8f0; }
    header { padding: 16px 24px; border-bottom: 1px solid #1e293b; display: flex; align-items: center; gap: 12px; }
    header h1 { font-size: 18px; margin: 0; }
    .wrap { display: grid; grid-template-columns: 360px 1fr; gap: 16px; padding: 16px 24px; }
    .card { background: #1e293b; border: 1px solid #334155; border-radius: 10px; padding: 16px; }
    .card h2 { margin: 0 0 12px; font-size: 14px; text-transform: uppercase; letter-spacing: .04em; color: #94a3b8; }
    label { display: block; font-size: 12px; color: #94a3b8; margin: 10px 0 4px; }
    input { width: 100%; padding: 8px 10px; border-radius: 6px; border: 1px solid #475569;
            background: #0f172a; color: #e2e8f0; font-size: 13px; }
    .row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px; }
    button { padding: 8px 14px; border-radius: 6px; border: 0; cursor: pointer; font-size: 13px; font-weight: 600; }
    .btn-primary { background: #2563eb; color: #fff; }
    .btn-green { background: #16a34a; color: #fff; }
    .btn-red { background: #dc2626; color: #fff; }
    .btn-ghost { background: #334155; color: #e2e8f0; }
    button:disabled { opacity: .5; cursor: not-allowed; }
    .badges { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
    .badge { font-size: 12px; padding: 4px 10px; border-radius: 999px; background: #334155; }
    .badge.on { background: #14532d; color: #bbf7d0; }
    .badge.off { background: #450a0a; color: #fecaca; }
    .badge.warn { background: #422006; color: #fed7aa; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid #1e293b; vertical-align: top; }
    th { color: #94a3b8; font-weight: 600; position: sticky; top: 0; background: #1e293b; }
    .metrics { font-family: ui-monospace, monospace; font-size: 12px; }
    .metric { display: inline-block; margin: 0 8px 2px 0; padding: 1px 6px; border-radius: 4px; background: #0f172a; }
    .scroll { max-height: 520px; overflow: auto; }
    .muted { color: #64748b; font-size: 12px; }
    .info { font-size: 12px; color: #cbd5e1; background: #0f172a; border: 1px solid #334155;
            border-radius: 6px; padding: 8px 10px; margin-top: 10px; white-space: pre-wrap; word-break: break-all; }
    code { background: #0f172a; padding: 1px 5px; border-radius: 4px; }
  </style>
</head>
<body>
  <header>
    <span style="font-size:22px">📡</span>
    <h1>Team MQTT Tester — giả lập đội thi nhận data</h1>
  </header>

  <div class="wrap">
    <!-- Cấu hình -->
    <div>
      <div class="card">
        <h2>Cấu hình</h2>
        <label>Backend URL</label>
        <input id="backend" value="http://localhost:3000" />
        <label>MQTT WebSocket URL</label>
        <input id="wsUrl" value="ws://localhost:9001" />
        <label>API Key của đội (tk_… = test · jk_… = judge)</label>
        <input id="apiKey" placeholder="tk_xxxxxxxx" />
        <label>MQTT Username (để trống nếu không dùng)</label>
        <input id="mqttUser" placeholder="Nhập Username MQTT..." />
        <label>MQTT Password (để trống nếu không dùng)</label>
        <input id="mqttPass" type="password" placeholder="Nhập Password MQTT..." />
        <label>Topic subscribe</label>
        <input id="topic" value="hackathon/#" />
        <p class="muted">Để mặc định <code>hackathon/#</code> để nghe tất cả (dev). Có thể thu hẹp, vd <code>hackathon/teamx/test/#</code>.</p>

        <div class="row">
          <button id="btnConnect" class="btn-primary">Kết nối MQTT</button>
          <button id="btnDisconnect" class="btn-ghost" disabled>Ngắt</button>
        </div>
        <div class="row">
          <button id="btnStart" class="btn-green" disabled>▶ Phát data (replay)</button>
          <button id="btnStop" class="btn-red" disabled>■ Dừng</button>
        </div>

        <div class="badges">
          <span id="mqttBadge" class="badge off">MQTT: chưa kết nối</span>
          <span id="replayBadge" class="badge">Replay: —</span>
        </div>
        <div id="info" class="info" style="display:none"></div>
      </div>
    </div>

    <!-- Data nhận được -->
    <div class="card">
      <h2>Data nhận được (<span id="count">0</span> message, mỗi message gói cả bộ device · 0.5s/lần) —
        <button id="btnClear" class="btn-ghost" style="padding:2px 8px">Xóa</button>
      </h2>
      <div class="scroll">
        <table>
          <thead>
            <tr><th style="width:190px">Thời gian (UTC)</th><th>Topic</th><th style="width:90px">Device</th><th>Metrics</th></tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    const $ = (id) => document.getElementById(id);
    let client = null;
    let statusTimer = null;
    let count = 0;
    let subTopic = null; // chỉ giữ 1 subscription để tránh nhận trùng

    // Thay subscription hiện tại bằng topic mới (unsubscribe cái cũ nếu khác).
    function applySubscription(topic) {
      if (!client || !topic) return;
      if (subTopic === topic) return;            // đã subscribe đúng topic này rồi
      if (subTopic) client.unsubscribe(subTopic); // bỏ topic cũ -> không bị overlap -> không nhận đôi
      client.subscribe(topic, (err) => {
        if (err) showInfo('Subscribe lỗi: ' + err.message);
        else showInfo('Đã subscribe: ' + topic);
      });
      subTopic = topic;
    }

    function setMqtt(state, text) {
      const b = $('mqttBadge');
      b.className = 'badge ' + state;
      b.textContent = 'MQTT: ' + text;
    }
    function setReplay(state, text) {
      const b = $('replayBadge');
      b.className = 'badge ' + (state || '');
      b.textContent = 'Replay: ' + text;
    }
    function showInfo(text) { const el = $('info'); el.style.display = 'block'; el.textContent = text; }

    function connect() {
      const url = $('wsUrl').value.trim();
      const topic = $('topic').value.trim() || 'hackathon/#';
      const username = $('mqttUser').value.trim();
      const password = $('mqttPass').value.trim();
      setMqtt('warn', 'đang kết nối…');
      try {
        const options = { reconnectPeriod: 3000, connectTimeout: 8000 };
        if (username) options.username = username;
        if (password) options.password = password;
        client = mqtt.connect(url, options);
      } catch (e) { setMqtt('off', 'lỗi URL'); return; }

      client.on('connect', () => {
        setMqtt('on', 'đã kết nối');
        subTopic = null;
        applySubscription(topic);
        $('btnConnect').disabled = true;
        $('btnDisconnect').disabled = false;
        $('btnStart').disabled = false;
        $('btnStop').disabled = false;
      });
      client.on('reconnect', () => setMqtt('warn', 'đang kết nối lại…'));
      client.on('error', (e) => setMqtt('off', 'lỗi: ' + (e.message || e)));
      client.on('close', () => setMqtt('off', 'đã đóng'));
      client.on('message', onMessage);
    }

    function disconnect() {
      if (client) { client.end(true); client = null; }
      subTopic = null;
      setMqtt('off', 'chưa kết nối');
      $('btnConnect').disabled = false;
      $('btnDisconnect').disabled = true;
      $('btnStart').disabled = true;
      $('btnStop').disabled = true;
      stopPolling();
    }

    function onMessage(topic, payloadBuf) {
      let payload;
      try { payload = JSON.parse(payloadBuf.toString()); } catch { payload = {}; }

      // Format mới: 1 message gói chung mọi device -> payload.devices = [{deviceCode,status,metrics}].
      // Fallback format cũ: payload.deviceCode + payload.metrics (1 device/message).
      const devices = Array.isArray(payload.devices)
        ? payload.devices
        : [{ deviceCode: payload.deviceCode, status: 'ok', metrics: payload.metrics }];

      // Thời gian: ưu tiên timestamp UTC do server gửi.
      const ts = payload.timestamp
        ? new Date(payload.timestamp).toLocaleTimeString() + '  ·  UTC ' + payload.timestamp
        : new Date().toLocaleTimeString();

      for (const d of devices) {
        const metrics = d.metrics || {};
        const metricHtml = d.status === 'error'
          ? '<span class="badge off">⚠ LỖI / mất kết nối</span>'
          : (Object.entries(metrics)
              .map(([k, v]) => `<span class="metric">${k} = <b>${v}</b></span>`).join('')
            || '<span class="muted">—</span>');
        const tr = document.createElement('tr');
        tr.innerHTML =
          `<td class="muted" style="font-size:11px">${ts}</td>` +
          `<td class="muted" style="font-size:12px">${topic}</td>` +
          `<td>${d.deviceCode ?? ''}</td>` +
          `<td class="metrics">${metricHtml}</td>`;
        $('rows').prepend(tr);
      }
      count++; // đếm theo số message (mỗi message = 1 bộ gói chung mọi device, 1s/lần)
      $('count').textContent = count;
    }

    async function callReplay(path) {
      const backend = $('backend').value.trim().replace(/\/$/, '');
      const apiKey = $('apiKey').value.trim();
      if (!apiKey) { showInfo('Chưa nhập API Key'); return null; }
      const method = path === 'status' ? 'GET' : 'POST';
      const res = await fetch(`${backend}/api/replay/${path}`, {
        method,
        headers: { 'X-API-Key': apiKey, 'Content-Type': 'application/json' },
        body: method === 'POST' ? '{}' : undefined,
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) { showInfo(`Lỗi ${res.status}: ${data.code || ''} — ${data.message || ''}`); return null; }
      return data.result;
    }

    async function startReplay() {
      const r = await callReplay('start');
      if (!r) return;
      const note = r.branch === 'JUDGE'
        ? 'Data sinh LIVE theo kịch bản admin (đổi kịch bản giữa chừng không cần ngắt).'
        : `Tổng: ${r.totalRecords} mốc (1 message/giây).`;
      showInfo(`✅ Bắt đầu\nĐội: ${r.teamCode} · Nhánh: ${r.branch}\n${note}\nTopic: ${r.topicPattern}`);
      // Chuyển hẳn sang topic của đội (thay vì thêm) để không nhận trùng.
      applySubscription(r.topicPattern);
      setReplay('warn', `${r.branch} · 0/${r.totalRecords}`);
      startPolling();
    }

    async function stopReplay() {
      const r = await callReplay('stop');
      if (r) setReplay('', `dừng · ${r.published}/${r.total}`);
      stopPolling();
    }

    function startPolling() {
      stopPolling();
      statusTimer = setInterval(async () => {
        const s = await callReplay('status');
        if (!s) return;
        const state = s.status === 'running' ? 'warn' : 'on';
        setReplay(state, `${s.status} · ${s.published}/${s.total}`);
        if (s.status !== 'running') stopPolling();
      }, 1500);
    }
    function stopPolling() { if (statusTimer) { clearInterval(statusTimer); statusTimer = null; } }

    $('btnConnect').onclick = connect;
    $('btnDisconnect').onclick = disconnect;
    $('btnStart').onclick = startReplay;
    $('btnStop').onclick = stopReplay;
    $('btnClear').onclick = () => { $('rows').innerHTML = ''; count = 0; $('count').textContent = '0'; };
  </script>
</body>
</html>
